services:
  - type: web
    name: taskflow-pro-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-pro-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: taskflow-pro-db
    plan: free
